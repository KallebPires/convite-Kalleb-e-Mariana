<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kalleb & Mariana convidam você para o almoço de namoro. Domingo, 27 de dezembro de 2026, 12h.">
<meta property="og:title" content="Kalleb & Mariana · Almoço de namoro">
<meta property="og:description" content="Domingo, 27 de dezembro de 2026, às 12h. Toque no envelope para abrir o convite.">
<meta name="theme-color" content="#EDF3EA">
<title>Kalleb &amp; Mariana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Jost:wght@400;500&display=swap">
<style>
html,body{margin:0}
body{font-size:14px;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}

/* Layout: one centered stage over a rose-garden canvas; envelope first, then the invite card. Single light look (letterpress invitation). */
:root {
  --ground: #EDF3EA;      /* verde bem claro */
  --leaf: #A8C79C;
  --leaf-deep: #5F8B5B;
  --paper: #FFFDF8;
  --paper-shade: #F3EEE4;
  --gold: #A9843F;        /* texto e linhas douradas */
  --gold-light: #DCC28A;
  --ink: #2E3A2F;
  --ink-soft: #55665A;
  --display: "Pinyon Script", "Snell Roundhand", cursive;
  --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --label: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--serif); overflow-x: hidden; }

#garden { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#petals { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

.stage {
  position: relative; z-index: 2; min-height: 100%;
  display: grid; place-items: center;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}

/* ---------- Envelope ---------- */
.env-wrap { display: grid; justify-items: center; gap: 22px; transition: opacity .7s ease, transform .7s ease; }
.env-wrap[hidden] { display: none !important; }
.env {
  all: unset; box-sizing: border-box; cursor: pointer; position: relative;
  width: min(86vw, 440px); aspect-ratio: 10 / 7; max-width: 100%;
  perspective: 1400px;
}
.env:focus-visible { outline: 2px solid var(--gold); outline-offset: 10px; border-radius: 6px; }
.env-back, .env-front, .env-flap { position: absolute; inset: 0; border-radius: 6px; }
.env-back { background: var(--paper-shade); box-shadow: 0 24px 50px -18px rgba(60, 80, 55, .45), 0 2px 6px rgba(60, 80, 55, .12); }
.env-front {
  z-index: 3;
  background:
    linear-gradient(to top right, transparent calc(50% - 1px), var(--gold-light) 50%, transparent calc(50% + 1px)) left bottom / 50% 100% no-repeat,
    linear-gradient(to top left, transparent calc(50% - 1px), var(--gold-light) 50%, transparent calc(50% + 1px)) right bottom / 50% 100% no-repeat;
  clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
  background-color: var(--paper);
  border: 1.5px solid var(--gold-light);
  box-sizing: border-box;
}
.env-front::after { content: ""; position: absolute; inset: 9px; border: 1px solid var(--gold-light); border-radius: 3px; clip-path: inherit; opacity: .7; }
.env-flap {
  z-index: 4; height: 58%;
  background: linear-gradient(180deg, var(--paper) 0%, var(--paper-shade) 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform .9s cubic-bezier(.6, .05, .25, 1), z-index 0s .45s;
}
.env-flap::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, var(--gold-light), var(--gold)); clip-path: polygon(0 0, 100% 0, 50% 100%, 50% calc(100% - 2px), calc(100% - 3px) 1px, 3px 1px, 50% calc(100% - 2px), 50% 100%); }
.seal {
  position: absolute; z-index: 5; left: 50%; top: 58%; width: 74px; height: 74px; translate: -50% -50%;
  border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #F0DCA6 0%, var(--gold-light) 30%, var(--gold) 75%, #8C6A2E 100%);
  box-shadow: 0 3px 8px rgba(90, 70, 30, .35), inset 0 0 0 4px rgba(255, 255, 255, .25);
  transition: opacity .35s ease, scale .35s ease;
}
.seal span { display: block; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 25px; line-height: 1; letter-spacing: .02em; white-space: nowrap; color: #FFF8E6; text-shadow: 0 1px 1px rgba(90, 60, 20, .5); text-align: center; }
.letter {
  position: absolute; z-index: 2; left: 7%; right: 7%; top: 8%; bottom: 6%;
  background: var(--paper); border-radius: 4px; border: 1px solid var(--gold-light);
  display: grid; place-items: center; text-align: center;
  transition: transform 1s cubic-bezier(.3, .7, .2, 1) .55s;
}
.letter p { margin: 0; font-family: var(--display); font-size: clamp(30px, 8vw, 42px); color: var(--ink); line-height: 1.1; }
.hint { font-family: var(--label); font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin: 0; }
.hint b { font-weight: 500; }
.to { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--ink-soft); margin: 0; }

.is-open .env-flap { transform: rotateX(178deg); z-index: 1; }
.is-open .seal { opacity: 0; scale: .6; }
.is-open .letter { transform: translateY(-58%); }
.is-gone .env-wrap { opacity: 0; transform: translateY(40px) scale(.94); }

@media (hover: hover) {
  .env:hover .env-flap { transform: rotateX(14deg); }
  .is-open .env:hover .env-flap { transform: rotateX(178deg); }
}

/* ---------- Invite card ---------- */
.card {
  position: relative; width: min(100%, 480px); box-sizing: border-box;
  background: var(--paper);
  border-radius: 6px;
  padding: clamp(40px, 9vw, 64px) clamp(24px, 7vw, 52px);
  text-align: center;
  box-shadow: 0 30px 60px -24px rgba(60, 80, 55, .45), 0 2px 8px rgba(60, 80, 55, .1);
  display: grid; justify-items: center; gap: 0;
}
.card[hidden] { display: none !important; }
.card::before, .card::after { content: ""; position: absolute; pointer-events: none; border: 1px solid var(--gold-light); border-radius: 3px; }
.card::before { inset: 12px; }
.card::after { inset: 18px; opacity: .55; }
.corner { position: absolute; width: 38px; height: 38px; color: var(--gold); }
.corner.tl { top: 8px; left: 8px; }
.corner.tr { top: 8px; right: 8px; rotate: 90deg; }
.corner.br { bottom: 8px; right: 8px; rotate: 180deg; }
.corner.bl { bottom: 8px; left: 8px; rotate: 270deg; }

.eyebrow { margin: 0; font-family: var(--label); font-size: 12px; font-weight: 500; letter-spacing: .38em; text-transform: uppercase; color: var(--gold); }
.sprig { width: 120px; height: 34px; margin-top: 18px; }
.names { margin: 18px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(58px, 15vw, 84px); line-height: 1; color: var(--ink); text-wrap: balance; }
.names .amp { display: block; font-family: var(--serif); font-style: italic; font-size: .55em; color: var(--gold); line-height: 1.2; }
.lede { margin: 26px 0 0; font-size: clamp(21px, 5vw, 24px); font-style: italic; line-height: 1.4; color: var(--ink-soft); max-width: 22em; text-wrap: balance; }

.details { margin-top: 34px; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: 1px solid var(--gold-light); }
.details div { padding: 18px 6px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.details div + div { border-left: 1px solid var(--gold-light); }
.details dt { font-family: var(--label); font-size: 11px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.details dd { margin: 0; font-size: 22px; font-weight: 500; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
.details small { display: block; font-size: 15px; font-weight: 400; font-style: italic; color: var(--ink-soft); margin-top: 2px; }

.rsvp { margin: 32px 0 0; font-family: var(--label); font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-soft); }
.again { all: unset; cursor: pointer; margin-top: 22px; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--gold); border-bottom: 1px solid var(--gold-light); padding-bottom: 1px; }
.again:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

@media (max-width: 380px) {
  .details { grid-template-columns: minmax(0, 1fr); }
  .details div + div { border-left: 0; border-top: 1px solid var(--gold-light); }
}

@media (prefers-reduced-motion: no-preference) {
  .card.reveal { animation: cardIn 1.1s cubic-bezier(.2, .7, .2, 1) both; }
  .card.reveal > * { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
  .card.reveal > :nth-child(5) { animation-delay: .25s; }
  .card.reveal > :nth-child(6) { animation-delay: .35s; }
  .card.reveal > :nth-child(7) { animation-delay: .5s; }
  .card.reveal > :nth-child(8) { animation-delay: .65s; }
  .card.reveal > :nth-child(9) { animation-delay: .8s; }
  .card.reveal > :nth-child(10) { animation-delay: .95s; }
  .hint { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(70px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes breathe { 50% { opacity: .55; } }
}
@media (prefers-reduced-motion: reduce) {
  .env-flap, .letter, .env-wrap, .seal { transition: none !important; }
}
</style>
</head>
<body>

<canvas id="garden" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>

<main class="stage" id="stage">
  <div class="env-wrap" id="envWrap">
    <p class="to">Para você, com carinho</p>
    <button class="env" id="env" type="button" aria-label="Abrir o envelope do convite">
      <span class="env-back"></span>
      <span class="letter"><p>Kalleb &amp; Mariana</p></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="seal" aria-hidden="true"><span>K&amp;M</span></span>
    </button>
    <p class="hint"><b>Toque no envelope</b></p>
  </div>

  <article class="card" id="card" hidden aria-live="polite">
    <svg class="corner tl" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 36 V12 Q4 4 12 4 H36" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9 30 V15 Q9 9 15 9 H30" fill="none" stroke="currentColor" stroke-width=".8" opacity=".6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
    <svg class="corner tr" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 36 V12 Q4 4 12 4 H36" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9 30 V15 Q9 9 15 9 H30" fill="none" stroke="currentColor" stroke-width=".8" opacity=".6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
    <svg class="corner br" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 36 V12 Q4 4 12 4 H36" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9 30 V15 Q9 9 15 9 H30" fill="none" stroke="currentColor" stroke-width=".8" opacity=".6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
    <svg class="corner bl" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 36 V12 Q4 4 12 4 H36" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9 30 V15 Q9 9 15 9 H30" fill="none" stroke="currentColor" stroke-width=".8" opacity=".6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>

    <p class="eyebrow">Almoço de namoro</p>
    <svg class="sprig" viewBox="0 0 120 34" aria-hidden="true">
      <path d="M8 17 H112" stroke="#DCC28A" stroke-width="1"/>
      <path d="M44 17 C 50 9, 56 8, 60 10 C 64 8, 70 9, 76 17" fill="none" stroke="#A9843F" stroke-width="1.1"/>
      <path d="M44 17 C 50 25, 56 26, 60 24 C 64 26, 70 25, 76 17" fill="none" stroke="#A9843F" stroke-width="1.1"/>
      <path d="M30 17 q-6 -7 -14 -6 q5 7 14 6 Z" fill="#A8C79C"/>
      <path d="M90 17 q6 -7 14 -6 q-5 7 -14 6 Z" fill="#A8C79C"/>
      <circle cx="60" cy="17" r="3" fill="#A9843F"/>
    </svg>
    <h1 class="names">Kalleb <span class="amp">&amp;</span> Mariana</h1>
    <p class="lede">convidam você para o almoço que celebra o nosso namoro</p>
    <dl class="details">
      <div><dt>Data</dt><dd>27 de dezembro<small>domingo, 2026</small></dd></div>
      <div><dt>Horário</dt><dd>12h</dd></div>
      <div><dt>Local</dt><dd>[LOCAL]</dd></div>
    </dl>
    <button class="again" id="again" type="button">Fechar o envelope</button>
  </article>
</main>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- seeded random ---------- */
  function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  /* ---------- rose garden ---------- */
  const garden = document.getElementById('garden');
  const gctx = garden.getContext('2d');

  function leaf(ctx, x, y, len, ang, col, vein) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * .3, -len * .32, len * .75, -len * .28, len, 0);
    ctx.bezierCurveTo(len * .75, len * .28, len * .3, len * .32, 0, 0);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = vein; ctx.lineWidth = Math.max(.6, len / 70);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * .5, -len * .04, len * .95, 0); ctx.stroke();
    for (let i = 1; i < 5; i++) {
      const t = i / 5;
      ctx.beginPath(); ctx.moveTo(len * t, -len * .02);
      ctx.lineTo(len * (t + .1), -len * .14 * (1 - t * .6)); ctx.moveTo(len * t, len * .01);
      ctx.lineTo(len * (t + .1), len * .13 * (1 - t * .6)); ctx.stroke();
    }
    ctx.restore();
  }

  function petal(ctx, w, h) {
    ctx.beginPath();
    ctx.moveTo(-w * .5, 0);
    ctx.bezierCurveTo(-w * .62, -h * .55, -w * .3, -h, 0, -h * .96);
    ctx.bezierCurveTo(w * .3, -h, w * .62, -h * .55, w * .5, 0);
    ctx.closePath();
  }

  function rose(ctx, x, y, r, rand) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rand() * Math.PI * 2);
    // soft shadow
    ctx.beginPath(); ctx.arc(r * .06, r * .1, r * 1.02, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(70, 95, 65, .16)'; ctx.fill();
    const layers = 6;
    for (let L = 0; L < layers; L++) {
      const k = 1 - L / layers;
      const n = 5 + (L % 2);
      const pr = r * (.25 + .75 * k);
      const off = rand() * Math.PI * 2;
      for (let i = 0; i < n; i++) {
        ctx.save();
        ctx.rotate(off + (i / n) * Math.PI * 2);
        const w = pr * (1.05 - L * .04), h = pr;
        const g = ctx.createLinearGradient(0, 0, 0, -h);
        g.addColorStop(0, `rgb(${226 - L * 4}, ${222 - L * 6}, ${206 - L * 8})`);
        g.addColorStop(.55, '#FBF8F1');
        g.addColorStop(1, '#FFFFFF');
        petal(ctx, w, h);
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = `rgba(185, 175, 150, ${.35 + L * .06})`; ctx.lineWidth = Math.max(.5, r / 90); ctx.stroke();
        ctx.restore();
      }
    }
    // center
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 5; a += .15) {
      const rr = r * .02 + a * r * .013;
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.strokeStyle = 'rgba(170, 155, 125, .75)'; ctx.lineWidth = Math.max(.7, r / 60); ctx.stroke();
    ctx.restore();
  }

  function bud(ctx, x, y, r, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    leaf(ctx, 0, r * .2, r * 1.1, Math.PI / 2 + .5, '#8FB583', 'rgba(60,95,58,.5)');
    leaf(ctx, 0, r * .2, r * 1.1, Math.PI / 2 - .5, '#A8C79C', 'rgba(60,95,58,.5)');
    ctx.beginPath(); ctx.ellipse(0, -r * .1, r * .55, r * .8, 0, 0, Math.PI * 2);
    const g = ctx.createLinearGradient(-r * .5, 0, r * .5, 0);
    g.addColorStop(0, '#E9E3D6'); g.addColorStop(.5, '#FFFFFF'); g.addColorStop(1, '#ECE6D9');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(180,170,145,.6)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * .2, -r * .8); ctx.quadraticCurveTo(r * .25, -r * .2, -r * .05, r * .5); ctx.stroke();
    ctx.restore();
  }

  function cluster(ctx, cx, cy, s, seed, spread) {
    const rand = rng(seed);
    const leafCols = ['#A8C79C', '#8FB583', '#B9D4AE', '#7FA673'];
    for (let i = 0; i < 11; i++) {
      const a = rand() * Math.PI * 2;
      const d = s * (.5 + rand() * .9) * spread;
      leaf(ctx, cx + Math.cos(a) * d * .5, cy + Math.sin(a) * d * .5, s * (.75 + rand() * .55), a + (rand() - .5) * .6,
        leafCols[i % 4], 'rgba(60, 95, 58, .45)');
    }
    for (let i = 0; i < 3; i++) {
      const a = rand() * Math.PI * 2, d = s * .55 * rand() * spread;
      bud(ctx, cx + Math.cos(a) * d * 1.6, cy + Math.sin(a) * d * 1.6, s * .22, a + Math.PI / 2);
    }
    const n = 3;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand();
      const d = i === 0 ? 0 : s * .62 * spread;
      rose(ctx, cx + Math.cos(a) * d, cy + Math.sin(a) * d, s * (i === 0 ? .58 : .42 + rand() * .1), rand);
    }
  }

  function drawGarden() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = innerWidth, h = innerHeight;
    garden.width = w * dpr; garden.height = h * dpr;
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gctx.clearRect(0, 0, w, h);
    const s = Math.max(70, Math.min(150, Math.min(w, h) * .2));
    const narrow = w < 640;
    cluster(gctx, -s * .15, -s * .1, s, 7, 1);
    cluster(gctx, w + s * .1, -s * .05, s * .9, 21, 1);
    cluster(gctx, -s * .05, h + s * .1, s * .95, 33, 1);
    cluster(gctx, w + s * .15, h - s * .05, s * 1.05, 47, 1);
    if (!narrow) {
      cluster(gctx, -s * .2, h * .5, s * .7, 59, .9);
      cluster(gctx, w + s * .2, h * .52, s * .7, 71, .9);
    }
  }
  drawGarden();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawGarden, 120); });

  /* ---------- falling petals on open ---------- */
  const pc = document.getElementById('petals'); const pctx = pc.getContext('2d');
  let flakes = [], running = false;
  function burst() {
    if (reduce) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    pc.width = innerWidth * dpr; pc.height = innerHeight * dpr; pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const rand = rng(Date.now() % 100000 + 3);
    flakes = Array.from({ length: 34 }, (_, i) => ({
      x: rand() * innerWidth, y: -20 - rand() * innerHeight * .6,
      s: 6 + rand() * 9, vy: .7 + rand() * 1.2, vx: (rand() - .5) * .6,
      rot: rand() * 6, vr: (rand() - .5) * .05, sway: rand() * 6, gold: i % 6 === 0
    }));
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    pctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = 0;
    for (const f of flakes) {
      f.y += f.vy; f.sway += .02; f.x += f.vx + Math.sin(f.sway) * .5; f.rot += f.vr;
      if (f.y < innerHeight + 30) alive++;
      pctx.save(); pctx.translate(f.x, f.y); pctx.rotate(f.rot);
      pctx.beginPath(); pctx.ellipse(0, 0, f.s * .55, f.s, 0, 0, Math.PI * 2);
      pctx.fillStyle = f.gold ? 'rgba(220, 194, 138, .85)' : 'rgba(255, 255, 255, .95)';
      pctx.shadowColor = 'rgba(80, 100, 70, .25)'; pctx.shadowBlur = 4;
      pctx.fill(); pctx.restore();
    }
    if (alive) requestAnimationFrame(tick); else { running = false; pctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  /* ---------- open / close ---------- */
  const stage = document.getElementById('stage');
  const env = document.getElementById('env');
  const wrap = document.getElementById('envWrap');
  const card = document.getElementById('card');
  const again = document.getElementById('again');
  let busy = false;

  env.addEventListener('click', () => {
    if (busy) return; busy = true;
    stage.classList.add('is-open');
    const t1 = reduce ? 0 : 1500, t2 = reduce ? 0 : 650;
    setTimeout(() => {
      stage.classList.add('is-gone');
      setTimeout(() => {
        wrap.hidden = true;
        card.hidden = false; card.classList.add('reveal');
        burst();
        card.focus?.();
        busy = false;
      }, t2);
    }, t1);
  });

  again.addEventListener('click', () => {
    card.classList.remove('reveal'); card.hidden = true;
    stage.classList.remove('is-open', 'is-gone');
    wrap.hidden = false;
    env.focus();
  });
})();
</script>

</body>
</html>
